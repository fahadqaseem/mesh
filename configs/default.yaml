# Default settings. Copy to configs/<experiment>.yaml to change things per experiment.

points:
  fusion: tsdf                   # tsdf (v3, default since 2026-11-09) | points (v2: concatenate filtered per-view points)
  tsdf:                          # used when fusion = tsdf (settings chosen on pencilpot only)
    mv_rel: 0.0                  # multi-view filter before fusion: off (the fusion averages the views)
    voxel_frac: 0.005            # voxel = 0.5% of the object size
    trunc_vox: 6                 # truncation = 6 voxels
    min_views: 1                 # surface wherever at least one view saw it
    min_part: 0.01               # drop fused pieces under 1% of the area
  view_ids: [0, 2, 4, 6, 9, 11, 13, 15]   # 8 views, 4 per ring (Mac memory rule); "all" for every image
  edge_rel: 0.0                  # depth-edge filter: drop pixels whose depth jumps > edge_rel * depth vs a neighbour (0 = off)
  edge_dilate: 1                 # widen detected edges by this many pixels
  fg_erode: 2                    # erode the foreground (conf > min_conf) mask by this many pixels
  mv_rel: 0.01                   # (fusion = points only) multi-view consistency: depth agreement tolerance (relative); 0 = off
  mv_min_views: 2                # keep points that at least this many other views agree with
  intrinsics: known              # predicted (VGGT's own focal) | known (render focal from gt_transform.json)
  use_depth_unprojection: true   # VGGT authors: depth + cameras is more accurate than the point head
  conf_percentile: 50            # drop the least confident half of pixels
  min_conf: 1.0
  outlier_k: 16
  outlier_std: 2.0
  voxel: 0.0                     # 0 = no downsampling; try 0.005 on big scenes
  max_points: 200000             # random cap after normals (Mac memory rule; MeshFlow resamples 4096 anyway)
  normal_k: 20                   # neighbours for PCA normals

mesh:
  mesher: meshflow_cvpr          # meshflow_cvpr | hdpea
  meshflow_cvpr:
    ckpt_dir: ckpt/meshflow/meshflow   # hf download nests config.yaml + model.pth one level down
    steps: 28
    seed: 42
    dtype: fp16                  # forced to fp32 off CUDA
    num_verts: null              # rough target vertex count, null = model decides
    device: null                 # null = auto: hybrid on Apple silicon (DiT on MPS, extraction on CPU), else cuda/cpu
  hdpea: {}

eval:
  n_samples: 100000
  tau: 0.01
